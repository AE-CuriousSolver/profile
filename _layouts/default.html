<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600&family=Caveat:wght@500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% seo %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-nav">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Anna-Marie<span class="brand-surname"> Edeleanu</span></span>
      </a>
      <nav aria-label="Main">
        <ul>
          <li><a href="{{ '/employment' | relative_url }}"{% if page.url contains 'employment' %} aria-current="page"{% endif %}>Experience</a></li>
          <li><a href="{{ '/profile' | relative_url }}"{% if page.url contains 'profile' %} aria-current="page"{% endif %}>About</a></li>
        </ul>
      </nav>
      <a class="btn btn-small" href="{{ site.cv_file | relative_url | uri_escape }}">CV</a>
    </div>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.time | date: '%Y' }} {{ site.author }}</p>
      <ul class="footer-links">
        <li><a href="mailto:{{ site.email }}">Email</a></li>
        <li><a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a href="{{ site.github_url }}" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
