applied:
  heading: "Applied experience"
  items:
    - title: "AI chatbot testing and training"
      text: >-
        Tested and trained a customer-facing AI chatbot across several versions,
        finding where it failed and improving its answers through structured
        feedback.
    - title: "CRM setup for a startup"
      text: >-
        Set up a CRM from scratch, designing the sales pipeline and process
        structure and connecting it with email and contacts.
    - title: "Workflow automation"
      text: >-
        Built lightweight automations, from Google Sheets scripts to AI-assisted
        workflows, to cut out repetitive manual work.
    - title: "Documentation and onboarding"
      text: >-
        Turned unwritten team knowledge into onboarding guides and process docs,
        so new staff could work independently sooner.

outside:
  heading: "Outside of tech"
  note: "the fun bit"
  paragraphs:
    - >-
      I'm creative and curious by nature. I paint, make pottery, knit and write,
      and I'm usually sketching ideas for inventions, systems or a book. To
      balance it out: ultra-running, scuba diving, swimming, sudoku and three
      years exploring New Zealand.
    - >-
      I like making spaces clearer and kinder. I set up a wellbeing hub at
      Lloyds, co-chaired Starling's Race and Ethnicity Network, and have
      volunteered in dementia care, helping young people leaving care find
      work, and at a turtle sanctuary in Costa Rica.
    - >-
      I'm social at heart and love bringing people together, whether that's a
      creative workshop or an "informal" games night that turns competitive fast.
