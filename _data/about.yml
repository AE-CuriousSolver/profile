# About page words. Edit the text here; the layout lives in _layouts/about.html.

intro: "The person behind the CV: how I think, the tools I use and what I get up to outside tech."

summary:
  heading: "About me"
  paragraphs:
    - >-
      I'm an inventor at heart. When something is confusing or clunky, I can't
      help designing something clearer. I think in systems, and I translate: I
      work out how technology really works and how people really use it, then make
      it make sense to the people who depend on it.
    - >-
      I trained as a mechanical engineer, then spent nearly four years as a
      software engineer at Lloyds and Starling, on fraud systems and
      Banking-as-a-Service APIs. I learned that the code was only part of what I
      care about. The other part is the people: their behaviour, their experience
      and how they actually use a system.
    - >-
      So I spent three years in New Zealand in people-focused roles, from tourism
      operations to facilitation, and found I kept improving the systems around
      me. Now I bring both together, working with startups on how their
      technology, data and people fit.

how_i_work:
  heading: "How I work"
  items:
    - title: "Listening first"
      text: >-
        I start by asking how things work today and what people actually need,
        before suggesting anything. Most problems look different once you've
        heard from everyone involved.
    - title: "Following it end to end"
      text: >-
        I follow a system across teams and tools to find where the friction
        really sits, rather than fixing one piece in isolation.
    - title: "Learning by doing"
      text: >-
        I pick up unfamiliar tools and domains quickly by getting hands-on and
        iterating until I understand how they work underneath.
    - title: "Honest and realistic"
      text: >-
        I say plainly what's done, what's missing and what a change will really
        cost, so decisions rest on an accurate picture.

