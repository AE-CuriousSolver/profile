# Homepage words. Edit the text here; the layout lives in _layouts/home.html.

intro:
  kicker: "Technical Consultant · System analysis and design · Backend engineering"
  heading: "Hi, I'm Anna-Marie."
  text: >-
    I trained as a mechanical engineer, then spent four years building backend
    systems at Lloyds and Starling. Now I help people understand how their
    technology fits together, from what a product captures to what its users
    actually see. This page is the detail behind my CV: where I've worked, how
    I work and what I'm building.
  status: "Open to remote contracts · AU/NZ time zones"

# "count" makes the number count up when it scrolls into view; leave it out for text values
metrics:
  - value: "4"
    count: 4
    label: "years in software engineering"
  - value: "2"
    count: 2
    label: "UK banks: Starling and Lloyds"
  - value: "MEng"
    label: "Mechanical Engineering, Cardiff"
  - value: "UK · EU"
    label: "working rights"

how_i_work:
  eyebrow: "How I work"
  heading: "Translating between people and technology"
  aside: "and I'm on your side"
  text: >-
    I listen first, then explain with diagrams, analogies and plain English, so
    you understand your own systems well enough to decide with confidence.
  # Handwritten labels on the diagram; keep each to about 3 words
  diagram:
    left: "You"
    left_subtitle: "people · teams"
    middle: "Me"
    right: "Your tech"
    right_subtitle: "APIs · data · cloud"
    you_to_me: "what you need"
    me_to_you: "plain English"
    me_to_tech: "clear specs"
    tech_to_me: "what's possible"

experience:
  eyebrow: "Experience highlights"
  heading: "Recent experience"
  link_text: "See all experience"
  items:
    - name: "Starling Bank"
      meta: "Software Engineer · London · 2021–2023"
      points:
        - "Designed Banking-as-a-Service onboarding APIs for partner clients"
        - "Led the fraud rules engine redesign on a £143B platform"
        - "Shaped requirements with clients, compliance and fraud investigators"
      tags: ["API design", "Fraud systems", "Java"]
    - name: "Lloyds Banking Group"
      meta: "Software Engineer · London · 2019–2020"
      points:
