skills:
  eyebrow: "What I'm good at"
  heading: "Skills, sketched"
  items:
    - sketch: api
      title: "APIs and integrations"
      text: "Clear contracts between systems, so every partner knows what to expect."
    - sketch: systems
      title: "System design"
      text: "From the big picture down to the edge cases that break things."
    - sketch: data
      title: "Data that makes sense"
      text: "From capture to calculation to what people see, with assumptions written down."
